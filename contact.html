<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Contact | Chimamanda Justus - Student Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <aside>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">home</a></li>
          <li><a href="about.html">about</a></li>
          <li><a href="projects.html">projects</a></li>
          <li><a href="planner.html">planner</a></li>
          <li><a href="contact.html">contact</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <header>
        <p>chimamanda justus</p>
        <span class="supporting">contact me</span>
      </header>

      <section class="hero">
        <p>
          have a question, an opportunity, or a project in mind? i'd love to
          hear from you.
        </p>
      </section>

      <section class="contact" aria-labelledby="contact-heading">
        <form class="contact-form" id="contact-form" novalidate>
          <div class="contact-fields">
            <div class="form-field">
              <label for="contact-name">name</label>
              <input
                type="text"
                id="contact-name"
                name="name"
                placeholder="your name"
                autocomplete="name"
                required />
              <span class="field-error" id="name-error"></span>
            </div>

            <div class="form-field">
              <label for="contact-email">email address</label>
              <input
                type="email"
                id="contact-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required />
              <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-field full-width">
              <label for="contact-phone">phone number</label>
              <input
                type="tel"
                id="contact-phone"
                name="phone"
                placeholder="08012345678"
                autocomplete="tel"
                inputmode="numeric"
                required />
              <span class="field-error" id="phone-error"></span>
            </div>

            <div class="form-field full-width">
              <label for="contact-message">message</label>
              <textarea
                id="contact-message"
                name="message"
                placeholder="write your message..."
                rows="6"
                required></textarea>
              <span class="field-error" id="message-error"></span>
            </div>
          </div>

          <button type="submit" class="contact-submit">send message</button>

          <p
            class="form-feedback"
            id="form-feedback"
            role="status"
            aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
